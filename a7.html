<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f2e9">
    <title>霓虹撞擊・打磚塊</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #182522;
            --paper: #f5f2e9;
            --coral: #ff5b4d;
            --lime: #cbf36b;
            --cyan: #64e5dc;
            --line: rgba(24, 37, 34, .16);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background-color: var(--paper);
            background-image: radial-gradient(rgba(24, 37, 34, .11) .7px, transparent .7px);
            background-size: 16px 16px;
            font-family: "Trebuchet MS", "Microsoft JhengHei", sans-serif;
        }
        button { font: inherit; }
        .page { width: min(100% - 36px, 1030px); margin: 0 auto; padding: 24px 0 32px; }
        .topline { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-mark { display: grid; place-items: center; width: 38px; aspect-ratio: 1; color: var(--ink); background: var(--lime); border: 1px solid var(--ink); border-radius: 50%; font-size: 20px; box-shadow: 3px 3px 0 var(--ink); }
        .brand-name { font-size: 14px; font-weight: 900; letter-spacing: .09em; }
        .brand-kicker { margin-top: 3px; color: #65706c; font: 700 10px/1.2 monospace; letter-spacing: .13em; }
        .top-actions { display: flex; gap: 8px; }
        .icon-button { display: grid; place-items: center; width: 42px; height: 42px; border: 1px solid var(--ink); border-radius: 50%; color: var(--ink); background: #fffdf6; cursor: pointer; transition: transform .16s, background .16s; }
        .icon-button:hover { transform: translateY(-2px); background: var(--cyan); }
        .icon-button:focus-visible, .start-button:focus-visible { outline: 3px solid #267b73; outline-offset: 3px; }
        .icon-button svg { width: 19px; height: 19px; }
        .game-layout { display: grid; grid-template-columns: minmax(0, 1fr) 205px; gap: 22px; align-items: start; padding-top: 21px; }
        .game-column { min-width: 0; }
        .game-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; padding: 0 2px 13px; }
        h1 { margin: 0; font-size: clamp(22px, 4vw, 34px); line-height: 1; letter-spacing: -.035em; }
        .level-tag { padding: 6px 9px; border: 1px solid var(--ink); border-radius: 2px; background: var(--coral); color: white; font: 800 10px/1 monospace; letter-spacing: .1em; white-space: nowrap; transform: rotate(-2deg); }
        .stage { position: relative; overflow: hidden; width: 100%; aspect-ratio: 1 / 1.08; border: 1px solid var(--ink); border-radius: 5px; background: #163a39; box-shadow: 7px 7px 0 var(--ink); isolation: isolate; }
        .stage::before { position: absolute; z-index: -1; inset: 0; content: ""; background: linear-gradient(145deg, rgba(100, 229, 220, .22), transparent 43%, rgba(255, 91, 77, .18)); }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        .overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(15, 34, 32, .55); backdrop-filter: blur(5px); }
        .overlay[hidden] { display: none; }
        .dialog { width: min(100%, 340px); padding: 24px 20px 20px; text-align: center; color: var(--ink); background: var(--paper); border: 1px solid var(--ink); border-radius: 4px; box-shadow: 6px 6px 0 var(--coral); animation: pop-in .32s cubic-bezier(.2, .8, .2, 1) both; }
        .dialog-mark { margin-bottom: 8px; color: var(--coral); font-size: 30px; line-height: 1; }
        .dialog h2 { margin: 0; font-size: 27px; line-height: 1.15; }
        .dialog p { margin: 8px 0 17px; color: #59635e; font-size: 13px; }
        .start-button { min-height: 44px; padding: 0 23px; border: 1px solid var(--ink); border-radius: 3px; background: var(--lime); color: var(--ink); box-shadow: 3px 3px 0 var(--ink); font-weight: 900; cursor: pointer; transition: transform .16s, box-shadow .16s; }
        .start-button:hover { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
        .sidebar { display: grid; gap: 12px; padding-top: 1px; }
        .score-block { padding: 15px 15px 17px; border: 1px solid var(--ink); border-radius: 3px; background: #fffdf6; box-shadow: 3px 3px 0 var(--ink); }
        .score-block.primary { background: var(--lime); }
        .stat-label { color: #47534d; font: 800 10px/1 monospace; letter-spacing: .12em; }
        .stat-value { margin-top: 8px; font: 900 34px/.95 "Trebuchet MS", sans-serif; font-variant-numeric: tabular-nums; }
        .stat-sub { margin-top: 7px; color: #58645e; font: 700 10px/1.3 monospace; }
        .life-row { display: flex; gap: 6px; margin-top: 13px; }
        .life { width: 12px; height: 12px; border: 1px solid var(--ink); border-radius: 50%; background: var(--coral); box-shadow: inset -2px -2px rgba(24, 37, 34, .18); }
        .life.lost { background: transparent; box-shadow: none; }
        .side-stamp { display: flex; align-items: center; justify-content: space-between; padding: 13px 14px; border: 1px solid var(--ink); background: var(--cyan); font: 800 10px/1 monospace; letter-spacing: .08em; }
        .side-stamp span:last-child { font-size: 19px; }
        .footerline { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; color: #58645e; font: 700 10px/1.4 monospace; letter-spacing: .06em; }
        @keyframes pop-in { from { opacity: 0; transform: translateY(8px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @media (max-width: 650px) {
            .page { width: min(100% - 24px, 510px); padding-top: 15px; }
            .game-layout { grid-template-columns: minmax(0, 1fr); gap: 14px; padding-top: 16px; }
            .stage { aspect-ratio: 1 / 1.13; box-shadow: 5px 5px 0 var(--ink); }
            .sidebar { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
            .score-block { padding: 11px 10px 12px; }
            .stat-value { font-size: 27px; }
            .stat-sub { font-size: 9px; }
            .life-row { gap: 4px; }
            .life { width: 10px; height: 10px; }
            .side-stamp { grid-column: 1 / -1; padding: 10px 12px; }
            .footerline { margin-top: 15px; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
</head>
<body>
    <main class="page">
        <header class="topline">
            <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><div><div class="brand-name">PLAY LAB</div><div class="brand-kicker">ARCADE / NO. 07</div></div></div>
            <div class="top-actions">
                <button class="icon-button" id="soundButton" type="button" aria-label="關閉音效" title="音效開啟" aria-pressed="false">
                    <svg id="soundIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
                </button>
                <button class="icon-button" id="restartButton" type="button" aria-label="重新開始" title="重新開始">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M19 12a7 7 0 1 1-2-5l3 5"/></svg>
                </button>
            </div>
        </header>
        <section class="game-layout" aria-label="打磚塊遊戲">
            <div class="game-column">
                <div class="game-head"><h1>霓虹撞擊</h1><span class="level-tag">ROUND 01</span></div>
                <div class="stage" id="stage">
                    <canvas id="gameCanvas" aria-label="3D 打磚塊遊戲區"></canvas>
                    <div class="overlay" id="overlay">
                        <section class="dialog" aria-live="polite">
                            <div class="dialog-mark" aria-hidden="true">✳</div>
                            <h2 id="dialogTitle">準備開打</h2>
                            <p id="dialogText">清空整面磚牆，拿下高分。</p>
                            <button class="start-button" id="startButton" type="button">開始遊戲</button>
                        </section>
                    </div>
                </div>
            </div>
            <aside class="sidebar" aria-label="遊戲數據">
                <section class="score-block primary"><div class="stat-label">SCORE</div><div class="stat-value" id="score">00000</div><div class="stat-sub">BEST <span id="best">00000</span></div></section>
                <section class="score-block"><div class="stat-label">LIVES</div><div class="stat-value" id="lifeCount">03</div><div class="life-row" id="lifeRow" aria-label="剩餘三條生命"><span class="life"></span><span class="life"></span><span class="life"></span></div></section>
                <section class="score-block"><div class="stat-label">BRICKS</div><div class="stat-value" id="brickCount">42</div><div class="stat-sub">TARGETS LEFT</div></section>
                <div class="side-stamp"><span>INSERT COIN<br>AND PLAY</span><span aria-hidden="true">↗</span></div>
            </aside>
        </section>
        <footer class="footerline"><span>NEON ARCADE · 2026</span><span>PLAY LOUD. STAY SHARP.</span></footer>
    </main>
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
        import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';

        const canvas = document.querySelector('#gameCanvas');
        const stage = document.querySelector('#stage');
        const overlay = document.querySelector('#overlay');
        const startButton = document.querySelector('#startButton');
        const scoreElement = document.querySelector('#score');
        const bestElement = document.querySelector('#best');
        const lifeElement = document.querySelector('#lifeCount');
        const lifeRow = document.querySelector('#lifeRow');
        const brickElement = document.querySelector('#brickCount');
        const soundButton = document.querySelector('#soundButton');
        const soundIcon = document.querySelector('#soundIcon');

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-7, 7, 7.55, -7.55, .1, 80);
        camera.position.set(0, 3.8, 28);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.25;

        scene.add(new THREE.HemisphereLight(0xd9fff7, 0x182b31, 2.1));
        const keyLight = new THREE.DirectionalLight(0xfff1d3, 3.5);
        keyLight.position.set(-5, 8, 12);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.set(1024, 1024);
        scene.add(keyLight);
        const rimLight = new THREE.PointLight(0x38e5de, 32, 24);
        rimLight.position.set(5, -2, 5);
        scene.add(rimLight);

        const board = new THREE.Mesh(new THREE.PlaneGeometry(12.8, 15.1), new THREE.MeshStandardMaterial({ color: 0x174341, roughness: .72, metalness: .12 }));
        board.position.z = -1.1;
        board.receiveShadow = true;
        scene.add(board);
        const boardLines = new THREE.Group();
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x71c9ac, transparent: true, opacity: .12 });
        for (let y = -7; y <= 7; y += 1) {
            const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-6.15, y, -.98), new THREE.Vector3(6.15, y, -.98)]), lineMaterial);
            boardLines.add(line);
        }
        scene.add(boardLines);

        const world = new CANNON.World({ gravity: new CANNON.Vec3(0, 0, 0) });
        world.broadphase = new CANNON.SAPBroadphase(world);
        world.allowSleep = false;
        const ballMaterial = new CANNON.Material('ball');
        const blockMaterial = new CANNON.Material('block');
        const paddleMaterial = new CANNON.Material('paddle');
        for (const material of [blockMaterial, paddleMaterial]) {
            world.addContactMaterial(new CANNON.ContactMaterial(ballMaterial, material, { friction: 0, restitution: 1 }));
        }
        world.addContactMaterial(new CANNON.ContactMaterial(ballMaterial, ballMaterial, { friction: 0, restitution: 1 }));

        const bodies = [];
        const bricks = [];
        const pendingBrickRemoval = [];
        let score = 0;
        let lives = 3;
        let active = false;
        let muted = false;
        let audioContext;
        let pointerX = 0;
        let previousPaddleX = 0;
        let keyboardDirection = 0;
        let frameTime = 0;
        let ballInPlay = false;
        let serveDelay = 0;
        const ballRadius = .205;
        const boardHalfWidth = 6.25;

        const wallMaterialVisual = new THREE.MeshStandardMaterial({ color: 0x236863, roughness: .34, metalness: .48 });
        const paddleVisual = new THREE.MeshStandardMaterial({ color: 0xd2f971, emissive: 0x3c6913, emissiveIntensity: .5, roughness: .28, metalness: .16 });
        const ballVisual = new THREE.MeshStandardMaterial({ color: 0xfff8db, emissive: 0xffb64f, emissiveIntensity: 1.15, roughness: .18, metalness: .06 });
        const paddleGeometry = new THREE.BoxGeometry(2.25, .33, .65);
        const paddleMesh = new THREE.Mesh(paddleGeometry, paddleVisual);
        paddleMesh.castShadow = true;
        paddleMesh.receiveShadow = true;
        paddleMesh.position.set(0, -6.55, .1);
        scene.add(paddleMesh);
        const paddleBody = new CANNON.Body({ mass: 0, type: CANNON.Body.KINEMATIC, material: paddleMaterial, position: new CANNON.Vec3(0, -6.55, 0) });
        paddleBody.addShape(new CANNON.Box(new CANNON.Vec3(1.125, .165, .325)));
        world.addBody(paddleBody);

        const ballMesh = new THREE.Mesh(new THREE.SphereGeometry(ballRadius, 28, 20), ballVisual);
        ballMesh.castShadow = true;
        scene.add(ballMesh);
        const ballBody = new CANNON.Body({ mass: .18, material: ballMaterial, linearDamping: 0, position: new CANNON.Vec3(0, -5.83, 0) });
        ballBody.addShape(new CANNON.Sphere(ballRadius));
        ballBody.fixedRotation = true;
        ballBody.updateMassProperties();
        ballBody.addEventListener('collide', event => {
            if (event.body === paddleBody) {
                const offset = THREE.MathUtils.clamp((ballBody.position.x - paddleBody.position.x) / 1.2, -1, 1);
                const speed = Math.max(7.2, ballBody.velocity.length());
                ballBody.velocity.set(offset * speed * .78 + paddleBody.velocity.x * .2, Math.abs(ballBody.velocity.y) + 2.6, 0);
                ballBody.velocity.normalize();
                ballBody.velocity.scale(speed, ballBody.velocity);
                sound(280, .08, 'triangle', .045);
            } else if (event.body.material === blockMaterial) {
                sound(520 + Math.random() * 180, .07, 'sine', .038);
            } else {
                sound(190, .055, 'triangle', .022);
            }
        });
        world.addBody(ballBody);

        function addWall(x, y, width, height) {
            const body = new CANNON.Body({ mass: 0, material: blockMaterial, position: new CANNON.Vec3(x, y, 0) });
            body.addShape(new CANNON.Box(new CANNON.Vec3(width / 2, height / 2, .45)));
            world.addBody(body);
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, .82), wallMaterialVisual);
            mesh.position.set(x, y, -.04);
            mesh.receiveShadow = true;
            mesh.castShadow = true;
            scene.add(mesh);
        }
        addWall(-6.28, 0, .42, 16.2);
        addWall(6.28, 0, .42, 16.2);
        addWall(0, 7.9, 12.98, .42);

        const brickColors = [0xff5364, 0xff8b3d, 0xffd34e, 0xb8ed58, 0x44d6c8, 0x8e8aff];
        const brickGeometry = new THREE.BoxGeometry(1.53, .49, .7);
        function buildBricks() {
            for (const brick of bricks) {
                scene.remove(brick.mesh);
                world.removeBody(brick.body);
                brick.mesh.geometry.dispose();
                brick.mesh.material.dispose();
            }
            bricks.length = 0;
            for (let row = 0; row < 6; row++) {
                for (let col = 0; col < 7; col++) {
                    const x = (col - 3) * 1.72;
                    const y = 6.35 - row * .72;
                    const material = new THREE.MeshStandardMaterial({ color: brickColors[row], emissive: brickColors[row], emissiveIntensity: .15, roughness: .3, metalness: .12 });
                    const mesh = new THREE.Mesh(brickGeometry, material);
                    mesh.position.set(x, y, .08);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    scene.add(mesh);
                    const body = new CANNON.Body({ mass: 0, material: blockMaterial, position: new CANNON.Vec3(x, y, 0) });
                    body.addShape(new CANNON.Box(new CANNON.Vec3(.765, .245, .35)));
                    body.userData = { broken: false };
                    body.addEventListener('collide', event => {
                        if (event.body !== ballBody || body.userData.broken) return;
                        body.userData.broken = true;
                        score += 100;
                        scoreElement.textContent = String(score).padStart(5, '0');
                        bestElement.textContent = String(Math.max(Number(bestElement.textContent), score)).padStart(5, '0');
                        try { localStorage.setItem('a7-best', String(Math.max(Number(localStorage.getItem('a7-best')) || 0, score))); } catch (_) {}
                        spawnBurst(x, y, brickColors[row]);
                        scene.remove(mesh);
                        pendingBrickRemoval.push(body);
                        brickElement.textContent = String(bricks.filter(item => !item.body.userData.broken).length - 1).padStart(2, '0');
                        if (bricks.every(item => item.body.userData.broken || item.body === body)) finish(true);
                    });
                    world.addBody(body);
                    bricks.push({ mesh, body });
                }
            }
            brickElement.textContent = String(bricks.length).padStart(2, '0');
        }

        const particles = [];
        function spawnBurst(x, y, color) {
            const material = new THREE.MeshBasicMaterial({ color, transparent: true });
            for (let i = 0; i < 9; i++) {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(.07 + Math.random() * .08, .07 + Math.random() * .08, .07), material);
                mesh.position.set(x, y, .55);
                scene.add(mesh);
                particles.push({ mesh, vx: (Math.random() - .5) * 5, vy: (Math.random() - .5) * 5, life: .38 + Math.random() * .2 });
            }
        }

        function sound(frequency, duration, type = 'sine', volume = .035) {
            if (muted) return;
            try {
                audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') audioContext.resume();
                const oscillator = audioContext.createOscillator();
                const gain = audioContext.createGain();
                oscillator.type = type;
                oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
                gain.gain.setValueAtTime(volume, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(.001, audioContext.currentTime + duration);
                oscillator.connect(gain).connect(audioContext.destination);
                oscillator.start();
                oscillator.stop(audioContext.currentTime + duration);
            } catch (_) {}
        }

        function syncHud() {
            scoreElement.textContent = String(score).padStart(5, '0');
            lifeElement.textContent = String(lives).padStart(2, '0');
            [...lifeRow.children].forEach((heart, index) => heart.classList.toggle('lost', index >= lives));
            lifeRow.setAttribute('aria-label', `剩餘 ${lives} 條生命`);
        }

        function resetBall() {
            ballInPlay = false;
            ballBody.position.set(paddleBody.position.x, -5.83, 0);
            ballBody.velocity.set(0, 0, 0);
            ballBody.angularVelocity.set(0, 0, 0);
        }

        function launchBall() {
            if (!active || ballInPlay) return;
            ballInPlay = true;
            const direction = (Math.random() - .5) * .16;
            ballBody.velocity.set(direction * 7.7, 7.7, 0);
            sound(440, .12, 'square', .025);
        }

        function showOverlay(title, text, buttonText) {
            document.querySelector('#dialogTitle').textContent = title;
            document.querySelector('#dialogText').textContent = text;
            startButton.textContent = buttonText;
            overlay.hidden = false;
        }

        function startGame() {
            if (active) return;
            score = 0;
            lives = 3;
            active = true;
            serveDelay = 0;
            buildBricks();
            syncHud();
            resetBall();
            overlay.hidden = true;
            launchBall();
        }

        function finish(won) {
            if (!active) return;
            active = false;
            ballInPlay = false;
            sound(won ? 720 : 120, .34, won ? 'sine' : 'sawtooth', .05);
            showOverlay(won ? '漂亮全清！' : '再來一局？', `本局得分 ${String(score).padStart(5, '0')}`, '再玩一次');
        }

        function resize() {
            const { width, height } = stage.getBoundingClientRect();
            if (!width || !height) return;
            renderer.setSize(width, height, false);
            const viewHeight = 16.9;
            const halfWidth = viewHeight * width / height / 2;
            camera.left = -halfWidth;
            camera.right = halfWidth;
            camera.top = viewHeight / 2;
            camera.bottom = -viewHeight / 2;
            camera.updateProjectionMatrix();
        }

        function update(dt) {
            const limit = boardHalfWidth - 1.35;
            let desiredX = pointerX;
            if (keyboardDirection) desiredX += keyboardDirection * 9 * dt;
            desiredX = THREE.MathUtils.clamp(desiredX, -limit, limit);
            const nextX = THREE.MathUtils.damp(paddleBody.position.x, desiredX, 18, dt);
            paddleBody.velocity.set((nextX - previousPaddleX) / Math.max(dt, .001), 0, 0);
            paddleBody.position.set(nextX, -6.55, 0);
            paddleMesh.position.x = nextX;
            previousPaddleX = nextX;

            if (active && serveDelay > 0) {
                serveDelay -= dt;
                if (serveDelay <= 0) launchBall();
            }
            if (active && ballInPlay) {
                world.step(1 / 60, dt, 4);
                for (const brickBody of pendingBrickRemoval) world.removeBody(brickBody);
                pendingBrickRemoval.length = 0;
                const speed = ballBody.velocity.length();
                if (speed > 0 && speed < 7.3) ballBody.velocity.scale(7.3 / speed, ballBody.velocity);
                if (speed > 11.5) ballBody.velocity.scale(11.5 / speed, ballBody.velocity);
                ballMesh.position.set(ballBody.position.x, ballBody.position.y, .3);
                if (ballBody.position.y < -7.55) {
                    lives--;
                    syncHud();
                    sound(150, .24, 'sawtooth', .045);
                    if (lives <= 0) finish(false);
                    else { resetBall(); serveDelay = .85; }
                }
            }
            for (let i = particles.length - 1; i >= 0; i--) {
                const particle = particles[i];
                particle.life -= dt;
                particle.mesh.position.x += particle.vx * dt;
                particle.mesh.position.y += particle.vy * dt;
                particle.mesh.rotation.z += dt * 9;
                particle.mesh.scale.multiplyScalar(Math.max(.01, 1 - dt * 2.5));
                if (particle.life <= 0) {
                    scene.remove(particle.mesh);
                    particle.mesh.material.dispose();
                    particle.mesh.geometry.dispose();
                    particles.splice(i, 1);
                }
            }
            ballMesh.position.set(ballBody.position.x, ballBody.position.y, .3);
        }

        function animate(now) {
            requestAnimationFrame(animate);
            const dt = Math.min((now - frameTime) / 1000 || 0, .033);
            frameTime = now;
            update(dt);
            ballMesh.rotation.x += dt * 2.5;
            ballMesh.rotation.y += dt * 3;
            renderer.render(scene, camera);
        }

        function movePaddle(event) {
            const rect = canvas.getBoundingClientRect();
            const normalized = (event.clientX - rect.left) / rect.width;
            const viewWidth = camera.right - camera.left;
            pointerX = (normalized - .5) * viewWidth;
            pointerX = THREE.MathUtils.clamp(pointerX, -boardHalfWidth + 1.35, boardHalfWidth - 1.35);
        }

        canvas.addEventListener('pointermove', movePaddle);
        canvas.addEventListener('pointerdown', event => {
            movePaddle(event);
            if (!active && overlay.hidden) startGame();
        });
        startButton.addEventListener('click', startGame);
        document.querySelector('#restartButton').addEventListener('click', () => {
            active = false;
            showOverlay('準備開打', '清空整面磚牆，拿下高分。', '開始遊戲');
            sound(360, .08);
        });
        soundButton.addEventListener('click', () => {
            muted = !muted;
            soundButton.setAttribute('aria-pressed', String(muted));
            soundButton.setAttribute('aria-label', muted ? '開啟音效' : '關閉音效');
            soundButton.title = muted ? '音效關閉' : '音效開啟';
            soundIcon.innerHTML = muted
                ? '<path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6m0-6-5 6"/>'
                : '<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>';
            if (!muted) sound(560, .08);
        });
        window.addEventListener('keydown', event => {
            if (['ArrowLeft', 'ArrowRight', 'a', 'A', 'd', 'D', ' '].includes(event.key)) event.preventDefault();
            if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') keyboardDirection = -1;
            if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd') keyboardDirection = 1;
            if (event.key === ' ' && active && !ballInPlay && serveDelay <= 0) launchBall();
        });
        window.addEventListener('keyup', event => {
            if (['ArrowLeft', 'ArrowRight', 'a', 'A', 'd', 'D'].includes(event.key)) keyboardDirection = 0;
        });
        window.addEventListener('blur', () => { keyboardDirection = 0; });
        window.addEventListener('resize', resize);
        try { bestElement.textContent = String(Number(localStorage.getItem('a7-best')) || 0).padStart(5, '0'); } catch (_) {}
        buildBricks();
        syncHud();
        resize();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
